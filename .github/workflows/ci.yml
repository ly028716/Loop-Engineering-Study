name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run documentation integrity check
        run: python scripts/check_docs.py
      - name: Run tests
        run: python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel

  semantic-gate:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run semantic regression gate
        run: python experiments/regression_gate.py
      - name: Upload semantic gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-gate-evidence
          path: .loop/runs/regression-gate/
          if-no-files-found: warn
